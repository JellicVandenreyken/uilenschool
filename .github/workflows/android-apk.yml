name: Android APK bouwen

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Afhankelijkheden installeren
        run: npm ci

      - name: Web-bestanden naar Android kopiëren
        run: npx cap sync android

      - name: APK bouwen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK hernoemen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Uilenschool.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Uilenschool-android
          path: Uilenschool.apk
